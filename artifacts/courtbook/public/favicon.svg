<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark rounded background -->
  <rect width="180" height="180" rx="40" fill="#0f0f1a"/>
  <!-- Subtle inner glow ring -->
  <rect x="4" y="4" width="172" height="172" rx="36" fill="none" stroke="#84cc16" stroke-width="6" stroke-opacity="0.25"/>
  <!-- Bold "K" letterform -->
  <text
    x="90"
    y="90"
    text-anchor="middle"
    dominant-baseline="central"
    font-family="'Inter', 'Arial Black', Arial, sans-serif"
    font-weight="800"
    font-size="110"
    fill="#84cc16"
    letter-spacing="-4"
  >K</text>
</svg>
