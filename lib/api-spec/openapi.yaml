openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: CourtBook API - Court booking platform for Lithuania
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: courts
    description: Court management
  - name: bookings
    description: Booking management
  - name: reviews
    description: Court reviews and ratings
  - name: payments
    description: Payment processing
  - name: stats
    description: Statistics and summaries
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /courts:
    get:
      operationId: listCourts
      tags: [courts]
      summary: List all courts
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [tennis, basketball, padel, football, badminton, squash]
        - name: city
          in: query
          schema:
            type: string
        - name: surface
          in: query
          schema:
            type: string
        - name: condition
          in: query
          schema:
            type: string
            enum: [excellent, good, fair]
        - name: isIndoor
          in: query
          schema:
            type: boolean
        - name: minPrice
          in: query
          schema:
            type: number
        - name: maxPrice
          in: query
          schema:
            type: number
        - name: ownerUserId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of courts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Court"
    post:
      operationId: createCourt
      tags: [courts]
      summary: Create a new court
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCourtBody"
      responses:
        "201":
          description: Court created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Court"

  /courts/{id}:
    get:
      operationId: getCourt
      tags: [courts]
      summary: Get court by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Court details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Court"
        "404":
          description: Court not found
    put:
      operationId: updateCourt
      tags: [courts]
      summary: Update a court
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCourtBody"
      responses:
        "200":
          description: Court updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Court"
    delete:
      operationId: deleteCourt
      tags: [courts]
      summary: Delete a court
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Court deleted

  /courts/{id}/availability:
    get:
      operationId: getCourtAvailability
      tags: [courts]
      summary: Get court availability for a date
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: date
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Available time slots
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityResponse"

  /courts/{id}/pricing:
    get:
      operationId: getCourtPricing
      tags: [courts]
      summary: Get pricing schedule for a court
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Pricing schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricingSchedule"
    put:
      operationId: setCourtPricing
      tags: [courts]
      summary: Set pricing schedule for a court (owner only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetPricingBody"
      responses:
        "200":
          description: Pricing updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricingSchedule"

  /courts/cities:
    get:
      operationId: listCities
      tags: [courts]
      summary: List all cities that have courts
      responses:
        "200":
          description: List of cities
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  /bookings:
    get:
      operationId: listBookings
      tags: [bookings]
      summary: List all bookings
      parameters:
        - name: courtId
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, confirmed, cancelled]
        - name: customerEmail
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of bookings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Booking"
    post:
      operationId: createBooking
      tags: [bookings]
      summary: Create a booking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookingBody"
      responses:
        "201":
          description: Booking created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"

  /bookings/{id}:
    get:
      operationId: getBooking
      tags: [bookings]
      summary: Get booking by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Booking details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
    delete:
      operationId: cancelBooking
      tags: [bookings]
      summary: Cancel a booking (with tiered partial refund)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Booking cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"

  /bookings/{id}/refund-preview:
    get:
      operationId: getRefundPreview
      tags: [bookings]
      summary: Preview refund amount for a booking cancellation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Refund preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefundPreview"

  /courts/{id}/reviews:
    get:
      operationId: listCourtReviews
      tags: [reviews]
      summary: List reviews for a court
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of reviews
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Review"
    post:
      operationId: createReview
      tags: [reviews]
      summary: Submit a review for a court after a booking
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReviewBody"
      responses:
        "201":
          description: Review created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
        "400":
          description: Validation error or booking already reviewed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                  - error
        "404":
          description: Booking not found or does not match court
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                  - error

  /payments/create-checkout:
    post:
      operationId: createCheckoutSession
      tags: [payments]
      summary: Create a Stripe checkout session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCheckoutBody"
      responses:
        "200":
          description: Checkout session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutSessionResponse"

  /payments/confirm:
    post:
      operationId: confirmPayment
      tags: [payments]
      summary: Confirm payment and finalize booking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmPaymentBody"
      responses:
        "200":
          description: Payment confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"

  /stats/summary:
    get:
      operationId: getStatsSummary
      tags: [stats]
      summary: Get platform stats summary
      responses:
        "200":
          description: Platform statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsSummary"

  /stats/popular-courts:
    get:
      operationId: getPopularCourts
      tags: [stats]
      summary: Get most booked courts
      responses:
        "200":
          description: Popular courts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PopularCourt"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Court:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        type:
          type: string
          enum: [tennis, basketball, padel, football, badminton, squash]
        description:
          type: string
        address:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        postcode:
          type: string
          nullable: true
        latitude:
          type: number
          nullable: true
        longitude:
          type: number
          nullable: true
        pricePerHour:
          type: number
        peakPricePerHour:
          type: number
          nullable: true
        rentableItems:
          type: string
          nullable: true
        imageUrl:
          type: string
        ownerUserId:
          type: string
          nullable: true
        ownershipDocUrl:
          type: string
          nullable: true
        amenities:
          type: array
          items:
            type: string
        amenityPhotos:
          type: string
          nullable: true
        isIndoor:
          type: boolean
        maxPlayers:
          type: integer
        surface:
          type: string
        condition:
          type: string
          enum: [excellent, good, fair]
        rating:
          type: number
        totalBookings:
          type: integer
        phone:
          type: string
        status:
          type: string
          enum: [draft, pending, approved, rejected]
        rejectionReason:
          type: string
          nullable: true
        socialFacebook:
          type: string
          nullable: true
        socialInstagram:
          type: string
          nullable: true
        socialWhatsapp:
          type: string
          nullable: true
        socialWebsite:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - type
        - pricePerHour
        - isIndoor
        - maxPlayers
        - condition
        - status
        - createdAt

    CreateCourtBody:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
          enum: [tennis, basketball, padel, football, badminton, squash]
        description:
          type: string
        pricePerHour:
          type: number
        imageUrl:
          type: string
        amenities:
          type: array
          items:
            type: string
        isIndoor:
          type: boolean
        maxPlayers:
          type: integer
        surface:
          type: string
        condition:
          type: string
          enum: [excellent, good, fair]
        facilityId:
          type: integer
        peakPricePerHour:
          type: number
          nullable: true
        rentableItems:
          type: string
          nullable: true
        workingHours:
          type: string
          nullable: true
        amenityPhotos:
          type: string
          nullable: true
      required:
        - name
        - type
        - pricePerHour
        - isIndoor
        - maxPlayers
        - facilityId

    AvailabilityResponse:
      type: object
      properties:
        courtId:
          type: integer
        date:
          type: string
        slots:
          type: array
          items:
            $ref: "#/components/schemas/TimeSlot"
      required:
        - courtId
        - date
        - slots

    TimeSlot:
      type: object
      properties:
        startTime:
          type: string
        endTime:
          type: string
        isAvailable:
          type: boolean
        price:
          type: number
      required:
        - startTime
        - endTime
        - isAvailable
        - price

    PricingEntry:
      type: object
      properties:
        dayOfWeek:
          type: integer
          minimum: 0
          maximum: 6
        startTime:
          type: string
        price:
          type: number
      required:
        - dayOfWeek
        - startTime
        - price

    PricingSchedule:
      type: object
      properties:
        courtId:
          type: integer
        entries:
          type: array
          items:
            $ref: "#/components/schemas/PricingEntry"
      required:
        - courtId
        - entries

    SetPricingBody:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/PricingEntry"
      required:
        - entries

    Booking:
      type: object
      properties:
        id:
          type: integer
        courtId:
          type: integer
        courtName:
          type: string
        customerName:
          type: string
        customerEmail:
          type: string
        date:
          type: string
          format: date
        startTime:
          type: string
        endTime:
          type: string
        totalPrice:
          type: number
        status:
          type: string
          enum: [pending, confirmed, cancelled, awaiting_players]
        stripeSessionId:
          type: string
        refundAmount:
          type: number
        stripeRefundId:
          type: string
        managementToken:
          type: string
          nullable: true
          description: Opaque token for guest bookings to manage the reservation without an account.
        createdAt:
          type: string
          format: date-time
        isSplit:
          type: boolean
          description: Whether this is a split-payment booking where multiple players each pay their share.
        totalSlots:
          type: integer
          description: Total number of player slots for a split booking.
        pricePerSlot:
          type: number
          description: Price each player pays for their slot in a split booking.
        splitInviteToken:
          type: string
          description: Shareable token for players to join and pay their share of a split booking.
      required:
        - id
        - courtId
        - customerName
        - customerEmail
        - date
        - startTime
        - endTime
        - totalPrice
        - status
        - createdAt

    RefundPreview:
      type: object
      properties:
        bookingId:
          type: integer
        totalPrice:
          type: number
        hoursBeforeStart:
          type: number
        refundPercent:
          type: integer
        refundAmount:
          type: number
        refundable:
          type: boolean
        canCancel:
          type: boolean
        reason:
          type: string
      required:
        - bookingId
        - totalPrice
        - hoursBeforeStart
        - refundPercent
        - refundAmount
        - refundable
        - canCancel

    CreateBookingBody:
      type: object
      properties:
        courtId:
          type: integer
        customerName:
          type: string
        customerEmail:
          type: string
        customerPhone:
          type: string
        date:
          type: string
          format: date
        startTime:
          type: string
        endTime:
          type: string
        rentedItems:
          type: string
          description: JSON-encoded array of rented items selected at booking time.
      required:
        - courtId
        - customerName
        - customerEmail
        - date
        - startTime
        - endTime

    CreateCheckoutBody:
      type: object
      properties:
        bookingId:
          type: integer
        successUrl:
          type: string
        cancelUrl:
          type: string
      required:
        - bookingId
        - successUrl
        - cancelUrl

    CheckoutSessionResponse:
      type: object
      properties:
        sessionId:
          type: string
        url:
          type: string
      required:
        - sessionId
        - url

    ConfirmPaymentBody:
      type: object
      properties:
        sessionId:
          type: string
      required:
        - sessionId

    StatsSummary:
      type: object
      properties:
        totalCourts:
          type: integer
        totalBookings:
          type: integer
        confirmedBookings:
          type: integer
        totalRevenue:
          type: number
        tennisCourts:
          type: integer
        basketballCourts:
          type: integer
        padelCourts:
          type: integer
      required:
        - totalCourts
        - totalBookings
        - confirmedBookings
        - totalRevenue
        - tennisCourts
        - basketballCourts

    PopularCourt:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        type:
          type: string
        city:
          type: string
        address:
          type: string
        imageUrl:
          type: string
        pricePerHour:
          type: number
        isIndoor:
          type: boolean
        condition:
          type: string
        bookingCount:
          type: integer
        revenue:
          type: number
      required:
        - id
        - name
        - type
        - city
        - bookingCount
        - revenue

    Review:
      type: object
      properties:
        id:
          type: integer
        courtId:
          type: integer
        bookingId:
          type: integer
        rating:
          type: integer
          minimum: 1
          maximum: 5
        reviewText:
          type: string
        reviewerName:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - courtId
        - bookingId
        - rating
        - reviewerName
        - createdAt

    CreateReviewBody:
      type: object
      properties:
        bookingId:
          type: integer
        rating:
          type: integer
          minimum: 1
          maximum: 5
        reviewText:
          type: string
        reviewerName:
          type: string
        photos:
          type: array
          items:
            type: string
      required:
        - bookingId
        - rating
        - reviewerName
